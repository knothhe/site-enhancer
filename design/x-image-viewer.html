<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片查看器 · 图标和快捷键</title><style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#fff;font:14px/1.5 system-ui;padding:16px;height:100vh;display:flex;flex-direction:column}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:9px;border:0;border-radius:8px;background:#ffffff15;color:#fff;cursor:pointer}button:focus-visible{outline:2px solid white}button:disabled{opacity:.3}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.count{margin-right:auto}.viewport{flex:1;min-height:0;position:relative;margin-top:16px}.stage{height:100%;overflow:scroll;scrollbar-gutter:stable;scrollbar-color:#59616c #101318}.canvas{min-height:100%;display:grid;place-items:center}.art{width:min(900px,80vw);height:65vh;background:linear-gradient(145deg,#84aba2,#314f4b 60%,#172e2a);display:grid;place-items:center}.side{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:56px;background:#101318d9}.prev{left:12px}.next{right:28px}footer{font-size:12px;color:#aeb6bf;padding-top:10px}.help{position:absolute;bottom:44px;left:16px;right:16px;z-index:3;padding:12px;background:#ffffff08;border-radius:8px;margin-top:8px}.help[hidden]{display:none}body.zoom .canvas{width:1800px;height:1200px}body.zoom .art{width:1800px;height:1200px}
</style><header><button aria-label="关闭" data-icon="close" title="关闭 (Esc)"></button><span class="count">2 / 4</span><button aria-label="缩小" data-icon="out" title="缩小 (-)"></button><span>100%</span><button aria-label="放大" data-icon="in" title="放大 (+)"></button><button aria-label="适应窗口" data-icon="fit" title="适应窗口 (0 / F)"></button><button aria-label="原始大小" data-icon="actual" title="原始大小 (1)"></button><button aria-label="上一张" data-icon="prev" title="上一张 (← / PageUp)"></button><button aria-label="下一张" data-icon="next" title="下一张 (→ / PageDown)"></button><button aria-label="快捷键" data-icon="help" onclick="document.querySelector('.help').hidden=!document.querySelector('.help').hidden" title="快捷键 (?)"></button></header><div class="viewport"><div class="stage"><div class="canvas"><div class="art">山林图片示意</div></div></div><button class="side prev" data-icon="prev" aria-label="上一张"></button><button class="side next" data-icon="next" aria-label="下一张"></button></div><footer>← → / 触摸板横滑切图 · + / − 缩放 · ? 快捷键 · Esc 关闭</footer><div class="help" hidden>← / → 或 PageUp / PageDown 切图；Home / End 首张 / 末张；+ / − 缩放；0 / F 适应窗口；1 原始大小；W A S D 或 Shift + 方向键平移；↑ / ↓ 垂直滚动；R 重试；? 显示 / 隐藏快捷键；Tab 切换控件；Enter / 空格激活按钮；Esc 关闭。触摸板横向滑动切图；图片超出窗口时，滑动用于平移图片。</div><script>
const paths={close:'M6 6l12 12M18 6L6 18',out:'M5 12h14',in:'M5 12h14M12 5v14',fit:'M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5',actual:'M7 8v8M5 9l2-1M17 8v8M15 9l2-1M11 10h.01M11 14h.01',prev:'M15 5l-7 7 7 7',next:'M9 5l7 7-7 7',help:'M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3M12 17h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18'};document.querySelectorAll('[data-icon]').forEach(b=>b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[b.dataset.icon]+'"/></svg>');const state=new URLSearchParams(location.search).get('state');if(state==='help')document.querySelector('.help').hidden=false;if(state==='zoom')document.body.classList.add('zoom');
</script><style>.notice{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#1c222b;padding:12px;border-radius:10px}.help{background:#1c222b}</style><script>if(['loading','error'].includes(state)){const notice=document.createElement('div');notice.className='notice';notice.textContent=state==='loading'?'正在加载第 3 张图片…（当前显示第 2 张）':'第 3 张图片加载失败，请重试。';document.querySelector('.viewport').append(notice)}</script><style>body.swipe .stage{position:relative;overflow:hidden}body.swipe .canvas{transform:translateX(-28%)}body.swipe .incoming{position:absolute;left:78%;top:0;height:100%;width:100%;display:grid;place-items:center;pointer-events:none}body.swipe .incoming .art{background:linear-gradient(145deg,#729bb9,#284e6b)}</style><script>if(state==='swipe'){document.body.classList.add('swipe');const next=document.createElement('div');next.className='incoming';next.innerHTML='<div class="art">下一张图片随手势进入</div>';document.querySelector('.stage').append(next);document.querySelector('footer').textContent='图片跟随横滑；停止手势后切换，距离不足或到达边界时回弹。启用减少动态效果时直接切图。'}</script></html>
